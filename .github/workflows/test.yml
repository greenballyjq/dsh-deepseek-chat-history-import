name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for file in index.js client.js lib/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: Unit tests
        run: npm test
      - name: Network audit
        run: npm run audit
