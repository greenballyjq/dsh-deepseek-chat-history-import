<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1500" height="1040" fill="#f5f7fb"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">摘要提示词：接入现有导入设置的概念图</text>
  <text x="40" y="82" font-size="16" fill="#64748b">预设 + 可编辑文本 + 宿主固定约束（用户不可见）· 不新增弹窗，不另起一套 UI</text>

  <!-- LEFT: existing panel -->
  <rect x="40" y="110" width="560" height="880" rx="16" fill="#ffffff" stroke="#dbe2ee" filter="url(#shadow)"/>
  <rect x="40" y="110" width="560" height="54" rx="16" fill="#f8fafc"/>
  <rect x="40" y="148" width="560" height="16" fill="#f8fafc"/>
  <text x="64" y="145" font-size="20" font-weight="700" fill="#0f172a">导入</text>
  <text x="520" y="144" font-size="13" fill="#94a3b8">侧栏面板（现有）</text>

  <!-- file row -->
  <rect x="64" y="186" width="512" height="38" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="80" y="210" font-size="13" fill="#475569">选择文件</text>
  <rect x="452" y="194" width="108" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="468" y="209" font-size="12" fill="#334155">选择文件</text>

  <!-- conversation list -->
  <rect x="64" y="238" width="512" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="78" y="260" font-size="12" fill="#94a3b8">对话列表（现有）</text>
  <rect x="76" y="270" width="488" height="26" rx="5" fill="#eff6ff"/>
  <text x="88" y="288" font-size="12" fill="#1d4ed8">示例对话 A</text>
  <text x="88" y="311" font-size="12" fill="#64748b">示例对话 B</text>
  <text x="88" y="334" font-size="12" fill="#64748b">示例对话 C</text>

  <!-- settings section -->
  <rect x="64" y="374" width="512" height="574" rx="12" fill="#fbfdff" stroke="#dbe2ee"/>
  <text x="84" y="404" font-size="16" font-weight="700" fill="#0f172a">导入设置</text>

  <!-- existing fields -->
  <text x="84" y="438" font-size="13" fill="#475569">版本</text>
  <rect x="150" y="420" width="210" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="162" y="440" font-size="12" fill="#334155">最后继续的版本</text>

  <text x="84" y="480" font-size="13" fill="#475569">保留最近</text>
  <rect x="150" y="462" width="70" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="168" y="482" font-size="12" fill="#334155">50</text>
  <text x="230" y="482" font-size="13" fill="#64748b">轮</text>
  <text x="300" y="482" font-size="12" fill="#94a3b8">共 120 轮</text>

  <text x="84" y="522" font-size="13" fill="#475569">超出部分</text>
  <circle cx="154" cy="517" r="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="168" y="522" font-size="12" fill="#475569">不保留</text>
  <circle cx="236" cy="517" r="6" fill="#2563eb"/>
  <text x="250" y="522" font-size="12" fill="#1d4ed8">概括为摘要</text>

  <text x="84" y="562" font-size="13" fill="#475569">摘要</text>
  <rect x="150" y="544" width="110" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="162" y="564" font-size="12" fill="#334155">标准</text>
  <text x="278" y="562" font-size="13" fill="#64748b">费用上限</text>
  <rect x="350" y="544" width="58" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="368" y="564" font-size="12" fill="#334155">2.0</text>
  <text x="416" y="564" font-size="13" fill="#64748b">元</text>

  <!-- NEW prompt block -->
  <rect x="76" y="592" width="488" height="270" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="92" y="582" width="156" height="22" rx="6" fill="#eff6ff"/>
  <text x="102" y="597" font-size="12" font-weight="700" fill="#1d4ed8">新增：摘要提示词</text>

  <text x="96" y="628" font-size="13" fill="#334155">提示词</text>
  <rect x="160" y="610" width="180" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="172" y="630" font-size="12" fill="#1d4ed8">中性（默认）</text>
  <text x="350" y="630" font-size="12" fill="#2563eb">恢复预设</text>

  <rect x="96" y="652" width="448" height="112" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="110" y="674" font-size="12" fill="#334155">请忠实压缩这段对话，保留目标、事实、决定、约束、</text>
  <text x="110" y="694" font-size="12" fill="#334155">未完成事项和重要结论；不要加入原文没有的内容，</text>
  <text x="110" y="714" font-size="12" fill="#334155">用对话原本的语言，按对话顺序写。</text>
  <text x="110" y="740" font-size="11" fill="#94a3b8">编辑后自动切换到“自定义”</text>
  <text x="486" y="756" font-size="11" fill="#94a3b8">约 80 字</text>

  <rect x="96" y="778" width="448" height="28" rx="6" fill="#f1f5f9"/>
  <text x="108" y="797" font-size="11" fill="#64748b">🔒 系统自动追加：字数上限 / 纯文本 / 原文语言（不显示）</text>
  <text x="96" y="828" font-size="11" fill="#94a3b8">预设由插件提供；自定义文本只随本次导入发送，不写入会话日志</text>

  <!-- estimate -->
  <text x="84" y="880" font-size="12" fill="#64748b">预计：保留 50 轮，前 70 轮概括为摘要 · ¥0.12</text>

  <!-- footer -->
  <rect x="84" y="900" width="128" height="34" rx="7" fill="#2563eb"/>
  <text x="116" y="922" font-size="14" font-weight="700" fill="#ffffff">导入</text>
  <text x="228" y="921" font-size="12" fill="#94a3b8">已选择：示例对话 A</text>

  <!-- RIGHT -->
  <text x="650" y="140" font-size="20" font-weight="700" fill="#0f172a">宿主侧：可见内容与固定约束分离</text>
  <text x="650" y="166" font-size="13" fill="#64748b">用户只需要编辑提示词正文；字数、纯文本、语言由代码追加，用户不可见。</text>

  <!-- flow row 1 -->
  <rect x="650" y="196" width="250" height="92" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="668" y="222" font-size="13" font-weight="700" fill="#1d4ed8">① 面板选择</text>
  <text x="668" y="246" font-size="12" fill="#475569">预设：中性 / 叙事 / 技术</text>
  <text x="668" y="266" font-size="12" fill="#475569">或编辑后自动进入“自定义”</text>

  <line x1="900" y1="242" x2="940" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="950" y="196" width="250" height="92" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="968" y="222" font-size="13" font-weight="700" fill="#1d4ed8">② 宿主解析</text>
  <text x="968" y="246" font-size="12" fill="#475569">预设 ID → 插件内置文本</text>
  <text x="968" y="266" font-size="12" fill="#475569">自定义 → trim + 长度校验</text>

  <line x1="1200" y1="242" x2="1240" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1250" y="196" width="210" height="92" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="1268" y="222" font-size="13" font-weight="700" fill="#1d4ed8">③ 拼装</text>
  <text x="1268" y="246" font-size="12" fill="#475569">可见 prompt</text>
  <text x="1268" y="266" font-size="12" fill="#475569">+ 隐藏 guard</text>

  <!-- compose detail -->
  <rect x="650" y="318" width="810" height="150" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="668" y="344" font-size="13" font-weight="700" fill="#0f172a">拼装结果（user 看不到右侧灰色部分）</text>

  <rect x="668" y="360" width="430" height="88" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="682" y="384" font-size="12" fill="#1e3a8a" font-weight="700">可见提示词</text>
  <text x="682" y="406" font-size="12" fill="#334155">用户选中的预设文本，或自定义文本</text>
  <text x="682" y="428" font-size="11" fill="#64748b">例如：忠实压缩，保留目标、决定、约束…</text>

  <text x="1108" y="404" font-size="20" fill="#64748b">+</text>

  <rect x="1132" y="360" width="310" height="88" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="1146" y="384" font-size="12" fill="#475569" font-weight="700">🔒 固定 guard（不可编辑）</text>
  <text x="1146" y="406" font-size="11" fill="#64748b">只输出纯文本；用原文语言；</text>
  <text x="1146" y="426" font-size="11" fill="#64748b">不超过 N 字；无需标题/套话。</text>

  <!-- flow row 2 -->
  <rect x="650" y="492" width="390" height="106" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="668" y="518" font-size="13" font-weight="700" fill="#1d4ed8">④ 调用与兜底</text>
  <text x="668" y="542" font-size="12" fill="#475569">maxTokens 按 N 收紧</text>
  <text x="668" y="562" font-size="12" fill="#475569">生成后再按 N 截断（防止提示词失效）</text>
  <text x="668" y="582" font-size="11" fill="#94a3b8">prompt 只是软约束，硬限制在宿主</text>

  <rect x="1060" y="492" width="400" height="106" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="1078" y="518" font-size="13" font-weight="700" fill="#1d4ed8">⑤ 费用预估 + 校准</text>
  <text x="1078" y="542" font-size="12" fill="#475569">用实际 prompt + guard 的 token 预估</text>
  <text x="1078" y="562" font-size="12" fill="#475569">不再固定按 300 tokens 算</text>
  <text x="1078" y="582" font-size="11" fill="#94a3b8">自定义提示词变长时，预估同步变化</text>

  <!-- state machine -->
  <rect x="650" y="626" width="810" height="156" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="668" y="652" font-size="13" font-weight="700" fill="#0f172a">状态：预设 ↔ 自定义</text>

  <rect x="668" y="668" width="150" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="684" y="690" font-size="12" font-weight="700" fill="#1d4ed8">中性（默认）</text>
  <text x="684" y="710" font-size="11" fill="#64748b">首次打开选中</text>

  <line x1="818" y1="695" x2="856" y2="695" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="828" y="682" font-size="10" fill="#2563eb">选择</text>

  <rect x="866" y="668" width="150" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="882" y="690" font-size="12" fill="#334155">叙事 / 技术预设</text>
  <text x="882" y="710" font-size="11" fill="#94a3b8">显示对应文本</text>

  <line x1="1016" y1="695" x2="1054" y2="695" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1022" y="682" font-size="10" fill="#2563eb">编辑</text>

  <rect x="1064" y="668" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1080" y="690" font-size="12" font-weight="700" fill="#15803d">自定义（自动）</text>
  <text x="1080" y="710" font-size="11" fill="#64748b">编辑即切换，保留草稿</text>

  <path d="M1149 722 C1149 758, 743 758, 743 722" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="900" y="770" font-size="11" fill="#64748b">“恢复预设”回到最后一次选中的预设；切换预设不丢自定义草稿</text>

  <!-- notes -->
  <rect x="650" y="800" width="810" height="190" rx="10" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="668" y="826" font-size="13" font-weight="700" fill="#0f172a">风格接入点（不是另起一套 UI）</text>
  <text x="668" y="852" font-size="12" fill="#475569">• 位置：现有“导入设置 → 概括为摘要”下方，复用同一个 section，不新增弹窗</text>
  <text x="668" y="874" font-size="12" fill="#475569">• 样式：沿用 dsdi-section / dsdi-field / dsdi-select / dsdi-input / dsdi-desc</text>
  <text x="668" y="896" font-size="12" fill="#475569">• 交互：沿用现有字段的紧凑行距；提示词编辑区可纵向 resize，窄屏不横向溢出</text>
  <text x="668" y="918" font-size="12" fill="#475569">• 可见性：仅“概括为摘要”时出现；选“不保留”时整块隐藏，不做死按钮</text>
  <text x="668" y="940" font-size="12" fill="#475569">• 估算：现有 estimate 请求带上提示词；字数/费用行在同一位置实时更新</text>
  <text x="668" y="962" font-size="12" fill="#475569">• 兼容：不传提示词 → 中性预设；旧 {{limit}} 模板自动替换，不要求用户维护变量</text>

  <text x="40" y="1024" font-size="11" fill="#94a3b8">概念图 · 仅用于讨论，不是最终实现；颜色/间距以现有面板 token 为准</text>
</svg>
